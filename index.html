/* Layout: aeroporto como linguagem — painel de chegadas, cartão de embarque e pista de Congonhas; paleta da marca: azul e branco */
:root{
  --bg:#F4F7FB;          /* branco azulado */
  --surface:#FFFFFF;
  --surface-2:#F0F4FA;
  --ink:#0F2140;         /* azul-marinho */
  --muted:#526079;
  --line:#D8E1EE;
  --accent:#1C5BC4;      /* azul da marca */
  --accent-ink:#FFFFFF;
  --accent-soft:#E3ECFA;
  --sky:#2F7DE1;
  --sky-soft:#E6F0FC;
  --board:#0F2140;
  --board-cell:#1A3260;
  --board-fg:#FFFFFF;
  --wood:#1C5BC4;
  --garden:#4F86D4;
  --shadow:0 1px 2px rgba(15,33,64,.06),0 12px 32px -12px rgba(15,33,64,.2);
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI","Hiragino Sans","Microsoft YaHei","PingFang SC",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1424;--surface:#101D33;--surface-2:#14243F;--ink:#E9F0FA;--muted:#9AAAC4;--line:#22355A;
  --accent:#5B9BFF;--accent-ink:#0A1424;--accent-soft:#16294A;--sky:#7DB3FF;--sky-soft:#152B4C;
  --board:#071022;--board-cell:#12264A;--board-fg:#FFFFFF;--wood:#3E7BE0;--garden:#5B8FD6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1424;--surface:#101D33;--surface-2:#14243F;--ink:#E9F0FA;--muted:#9AAAC4;--line:#22355A;
  --accent:#5B9BFF;--accent-ink:#0A1424;--accent-soft:#16294A;--sky:#7DB3FF;--sky-soft:#152B4C;
  --board:#071022;--board-cell:#12264A;--board-fg:#FFFFFF;--wood:#3E7BE0;--garden:#5B8FD6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px -12px rgba(0,0,0,.6);color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:.6rem}
.eyebrow::before{content:"";width:22px;height:2px;background:currentColor}
.h2{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,4.4vw,3.3rem);line-height:.98;text-transform:uppercase;letter-spacing:.005em}
.lead{color:var(--muted);max-width:60ch}
.section{padding-block:clamp(64px,9vw,112px)}
.sec-head{display:grid;gap:14px;margin-bottom:clamp(28px,4vw,44px)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;border:0;border-radius:999px;padding:.8rem 1.35rem;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .15s ease,background .15s ease,box-shadow .15s ease;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--accent)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--ink)}
.ico{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* faixa de prévia + header */
.strip{background:var(--ink);color:var(--bg);font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-align:center;padding-block:7px}
.strip .wrap{display:block}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;height:70px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--accent);display:grid;place-items:center}
.brand-mark svg{width:24px;height:24px}
.brand-txt{display:grid;line-height:1}
.brand-txt b{font-family:var(--f-display);font-weight:800;font-size:1.45rem;letter-spacing:.03em;text-transform:uppercase}
.brand-txt span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main button{background:none;border:0;padding:.5rem .7rem;border-radius:8px;cursor:pointer;font-weight:500;font-size:.94rem;color:var(--muted)}
nav.main button:hover{color:var(--ink);background:var(--surface-2)}
.top-actions{display:flex;align-items:center;gap:10px}
.burger{display:none;background:none;border:1.5px solid var(--line);border-radius:10px;width:42px;height:42px;place-items:center;cursor:pointer}
@media (max-width:1040px){nav.main{display:none}.top-actions{margin-left:auto}.burger{display:grid}}
@media (max-width:520px){.top-actions .btn-accent{display:none}.brand-txt span{display:none}}

/* seletor de idioma */
.lang{position:relative}
.lang-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:.42rem .7rem .42rem .5rem;cursor:pointer;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.lang-btn:hover{border-color:var(--ink)}
.flag{width:24px;height:16px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.12);overflow:hidden;display:block}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;width:236px;display:grid;gap:2px;z-index:70}
.lang-opt{display:flex;align-items:center;gap:12px;padding:.55rem .7rem;border-radius:9px;background:none;border:0;cursor:pointer;text-align:left;width:100%}
.lang-opt:hover{background:var(--surface-2)}
.lang-opt[aria-checked="true"]{background:var(--accent-soft)}
.lang-opt small{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* drawer mobile */
.drawer{position:fixed;inset:0;z-index:80;background:var(--surface);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;height:70px}
.drawer nav{display:grid;gap:2px;padding-block:8px}
.drawer nav button{background:none;border:0;border-bottom:1px solid var(--line);text-align:left;padding:1rem 0;font-family:var(--f-display);font-weight:800;font-size:1.9rem;text-transform:uppercase;cursor:pointer}
.drawer .langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding-block:20px}
.drawer .langs .lang-opt{border:1px solid var(--line)}
.drawer-foot{margin-top:auto;padding-block:16px}
.drawer-foot .btn{width:100%}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(36px,6vw,72px) clamp(56px,7vw,88px)}
.hero-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero-bg .rwy{position:absolute;right:-6%;top:-12%;width:58%;height:140%;background:var(--ink);opacity:.045;transform:rotate(-10deg);border-radius:6px}
.hero-bg .rwy::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;margin-left:-4px;background:repeating-linear-gradient(var(--bg) 0 46px,transparent 46px 92px);opacity:1}
.hero-bg .cgh{position:absolute;right:2%;bottom:-6%;font-family:var(--f-display);font-weight:800;font-size:clamp(9rem,26vw,22rem);line-height:.8;color:var(--ink);opacity:.05;letter-spacing:-.02em}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(28px,5vw,64px);align-items:start}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(2.9rem,7.2vw,5.6rem);line-height:.9;letter-spacing:-.005em;margin-top:18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{margin-top:20px;font-size:1.08rem}
:lang(zh) .hero h1,:lang(ja) .hero h1,:lang(zh) .h2,:lang(ja) .h2{font-family:var(--f-body);font-weight:700;letter-spacing:0;line-height:1.15}
:lang(zh) .hero h1,:lang(ja) .hero h1{font-size:clamp(2.2rem,5vw,3.9rem)}

/* painel de chegadas */
.board{margin-top:30px;background:var(--board);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);max-width:560px}
.board-head{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#8FA0AD;padding:0 4px 12px}
.board-head .live{display:flex;align-items:center;gap:6px;color:var(--board-fg)}
.board-head .live i{width:7px;height:7px;border-radius:50%;background:var(--board-fg);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.board-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid rgba(255,255,255,.07)}
.board-row span{color:#C9D3DA;font-size:.9rem;min-width:0}
.flap{display:flex;gap:3px;flex:none}
.flap b{font-family:var(--f-mono);font-weight:600;font-size:.95rem;color:var(--board-fg);background:var(--board-cell);min-width:1.15em;text-align:center;padding:3px 2px;border-radius:3px;position:relative;line-height:1.25}
.flap b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.flap b.sp{background:transparent;min-width:.45em}
.flap b.sp::after{display:none}

/* cartão de embarque (busca) */
.pass{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.pass-top{background:var(--accent);color:var(--accent-ink);padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pass-top b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.pass-top span{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;opacity:.85}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:22px 22px 18px}
.route .code{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1}
.route small{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.route .nm{font-size:.84rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .to{text-align:right}
.route .path{display:flex;align-items:center;gap:6px;color:var(--accent)}
.route .path i{width:34px;border-top:2px dashed var(--line)}
.perf{position:relative;height:0;border-top:2px dashed var(--line);margin:0 22px}
.perf::before,.perf::after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
.perf::before{left:-35px}.perf::after{right:-35px}
.pass form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:20px 22px 22px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:.7rem .75rem;min-width:0}
.field input:focus,.field select:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px var(--sky-soft)}
.pass .full{grid-column:1/-1}
.pass .btn{width:100%;padding:1rem}
.pass .note{font-size:.82rem;color:var(--muted);text-align:center;display:flex;gap:6px;justify-content:center;align-items:center}
.err{color:var(--accent);font-size:.86rem;font-weight:600}
@media (max-width:420px){.pass form{grid-template-columns:minmax(0,1fr)}.route .code{font-size:2.1rem}}

/* comodidades */
.amen{background:var(--surface);border-block:1px solid var(--line)}
.amen-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.amen-item{background:var(--surface);padding:26px 24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.amen-item .ic{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.amen-item .ic .ico{width:24px;height:24px}
.amen-item h3{font-size:1.05rem;font-weight:600}
.amen-item p{color:var(--muted);font-size:.92rem}
@media (max-width:860px){.amen-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.amen-grid{grid-template-columns:minmax(0,1fr)}}

/* fotos (placeholders) */
.ph{position:relative;border-radius:var(--r);overflow:hidden;display:grid;place-items:center;color:rgba(255,255,255,.92);min-height:160px;isolation:isolate}
.ph::before{content:"";position:absolute;inset:0;z-index:-1;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 38px)}
.ph .ico{width:38px;height:38px;stroke-width:1.4}
.ph figcaption{position:absolute;left:12px;bottom:12px;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:4px 8px;border-radius:6px}
.t-wood{background:linear-gradient(140deg,var(--wood),#0E3270)}
.t-garden{background:linear-gradient(140deg,var(--garden),#24508F)}
.t-sky{background:linear-gradient(140deg,#7FA9E0,#3D6DB5)}
.t-ink{background:linear-gradient(140deg,#24406B,#0F2140)}
.t-accent{background:linear-gradient(140deg,#2F7DE1,#0B2E66)}
.t-sand{background:linear-gradient(140deg,#A9C3E8,#5E84BD)}

/* sobre */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,72px);align-items:center}
.about-text{display:grid;gap:18px}
.about-text p{color:var(--muted);max-width:56ch}
.mosaic{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:200px 200px;gap:12px}
.mosaic .ph:first-child{grid-row:span 2}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem .85rem;font-size:.86rem;font-weight:500}
.chip .ico{color:var(--accent);width:1.05em;height:1.05em}
@media (max-width:860px){.about-grid{grid-template-columns:minmax(0,1fr)}.mosaic{grid-template-rows:170px 170px}}

/* quartos */
.rooms-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.room .ph{border-radius:0;min-height:190px}
.room-body{padding:20px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.room-body h3{font-family:var(--f-display);font-weight:800;font-size:1.6rem;text-transform:uppercase;line-height:1}
:lang(zh) .room-body h3,:lang(ja) .room-body h3{font-family:var(--f-body);font-weight:700;font-size:1.25rem}
.room-body p{color:var(--muted);font-size:.93rem}
.room-tags{display:flex;flex-wrap:wrap;gap:8px}
.room-tags span{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:.25rem .55rem}
.room-tags .ico{width:1em;height:1em}
